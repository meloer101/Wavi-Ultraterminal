<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="1600" height="320" role="img" aria-label="分头开工，合到一处。">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif} .m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'PingFang SC','Noto Sans SC',monospace}
.flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
.slow{animation-duration:2.4s}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.3);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{0%{stroke-dashoffset:1400}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.spin,.pulse,.draw{animation:none}.draw{stroke-dashoffset:0}.up{animation:none;opacity:1}.dot{display:none}}
</style>
